</style><rect x="-26" y="-36" width="2362" height="752" fill="#fff"/><rect class="d-frame" x="-10" y="-20" width="2330" height="720"/><path class="d-frame-tab" d="M-10 -20h232.6v14l-10 10H-10z"/><text class="d-mono" x="0" y="-4">req [package] Rules [The rules]</text><g class="d-symbols"><g class="d-sym c-b" data-sym="sy_043" transform="translate(620 40)"><rect class="d-shape" width="283" height="120"/><text class="d-mono" x="141.5" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="141.5" y="36" text-anchor="middle">House rules</text><path class="d-rule" d="M0 46H283"/><text x="10" y="64">id = &quot;UI1&quot;</text><text x="10" y="80">text = &quot;These describe the HUD skin. Under</text><text x="10" y="96">the macOS skin the platform’s conventions</text><text x="10" y="112">replace 1, 2 and 5; 3 and 4 always hold.&quot;</text></g><g class="d-sym c-b" data-sym="sy_044" transform="translate(1490 40)"><rect class="d-shape" width="263" height="104"/><text class="d-mono" x="131.5" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="131.5" y="36" text-anchor="middle">Honest copies</text><path class="d-rule" d="M0 46H263"/><text x="10" y="64">id = &quot;UI2&quot;</text><text x="10" y="80">text = &quot;A vendored copy shall match the</text><text x="10" y="96">kit it came from.&quot;</text></g><g class="d-sym c-b" data-sym="sy_045" transform="translate(40 320)"><rect class="d-shape" width="260" height="120"/><text class="d-mono" x="130" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="130" y="36" text-anchor="middle">Orbitron for labels</text><path class="d-rule" d="M0 46H260"/><text x="10" y="64">id = &quot;UI1.2&quot;</text><text x="10" y="80">text = &quot;Orbitron is for labels, buttons</text><text x="10" y="96">and headings only. Anything read at</text><text x="10" y="112">length uses Exo 2.&quot;</text></g><g class="d-sym c-b" data-sym="sy_046" transform="translate(330 320)"><rect class="d-shape" width="260" height="120"/><text class="d-mono" x="130" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="130" y="36" text-anchor="middle">Chamfers and brackets</text><path class="d-rule" d="M0 46H260"/><text x="10" y="64">id = &quot;UI1.1&quot;</text><text x="10" y="80">text = &quot;Pressable things are</text><text x="10" y="96">chamfered, and framing things get</text><text x="10" y="112">brackets. Don’t round corners.&quot;</text></g><g class="d-sym c-b" data-sym="sy_047" transform="translate(620 320)"><rect class="d-shape" width="264" height="104"/><text class="d-mono" x="132" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="132" y="36" text-anchor="middle">One glow per region</text><path class="d-rule" d="M0 46H264"/><text x="10" y="64">id = &quot;UI1.3&quot;</text><text x="10" y="80">text = &quot;The active item and the primary</text><text x="10" y="96">action glow; nothing else does.&quot;</text></g><g class="d-sym c-b" data-sym="sy_048" transform="translate(910 320)"><rect class="d-shape" width="260" height="104"/><text class="d-mono" x="130" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="130" y="36" text-anchor="middle">Status colours carry meaning</text><path class="d-rule" d="M0 46H260"/><text x="10" y="64">id = &quot;UI1.4&quot;</text><text x="10" y="80">text = &quot;Don’t use --sc-danger for</text><text x="10" y="96">decoration.&quot;</text></g><g class="d-sym c-b" data-sym="sy_049" transform="translate(1200 320)"><rect class="d-shape" width="260" height="136"/><text class="d-mono" x="130" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="130" y="36" text-anchor="middle">Subtle effects</text><path class="d-rule" d="M0 46H260"/><text x="10" y="64">id = &quot;UI1.5&quot;</text><text x="10" y="80">text = &quot;Scanlines stay at their opacity,</text><text x="10" y="96">and everything decorative respects</text><text x="10" y="112">data-sc-effects=&quot;off&quot; and</text><text x="10" y="128">prefers-reduced-motion.&quot;</text></g><g class="d-sym c-b" data-sym="sy_050" transform="translate(1490 320)"><rect class="d-shape" width="260" height="120"/><text class="d-mono" x="130" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="130" y="36" text-anchor="middle">Never edit a copy</text><path class="d-rule" d="M0 46H260"/><text x="10" y="64">id = &quot;UI2.1&quot;</text><text x="10" y="80">text = &quot;Change the kit here, then</text><text x="10" y="96">refresh from the app. This repo never</text><text x="10" y="112">writes into a sibling.&quot;</text></g><g class="d-sym c-b" data-sym="sy_051" transform="translate(1780 320)"><rect class="d-shape" width="264" height="104"/><text class="d-mono" x="132" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="132" y="36" text-anchor="middle">A stale copy cannot ship</text><path class="d-rule" d="M0 46H264"/><text x="10" y="64">id = &quot;UI2.2&quot;</text><text x="10" y="80">text = &quot;An app’s build and serve scripts</text><text x="10" y="96">run --check and stop on drift.&quot;</text></g><g class="d-sym " data-sym="sy_052" transform="translate(505 600)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">kit.css</text></g><g class="d-sym " data-sym="sy_053" transform="translate(40 600)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">Fonts</text></g><g class="d-sym " data-sym="sy_054" transform="translate(910 600)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">tokens.css</text></g><g class="d-sym " data-sym="sy_055" transform="translate(1200 600)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">theme.js</text></g><g class="d-sym " data-sym="sy_056" transform="translate(1490 600)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">copy-into</text></g><g class="d-sym c-b" data-sym="sy_057" transform="translate(1780 40)"><rect class="d-shape" width="260" height="120"/><text class="d-mono" x="130" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="130" y="36" text-anchor="middle">One source of truth</text><path class="d-rule" d="M0 46H260"/><text x="10" y="64">id = &quot;UI3&quot;</text><text x="10" y="80">text = &quot;Every colour, font and spacing</text><text x="10" y="96">value shall come from tokens.json; CSS</text><text x="10" y="112">and Swift are generated from it.&quot;</text></g><g class="d-sym " data-sym="sy_058" transform="translate(2070 60)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">build-tokens</text></g></g><g class="d-paths"><g class="d-path" data-path="pa_041"><path class="d-hit" d="M762 160L762 240L170 240L170 320"/><path class="d-line" d="M762 160L762 240L170 240L170 320"/><g transform="translate(762 160) rotate(-90)"><circle class="d-head hollow" cx="-7" cy="0" r="7"/><path class="d-head" d="M-14 0H0M-7 -7V7"/></g></g><g class="d-path" data-path="pa_042"><path class="d-hit" d="M762 160L762 240L460 240L460 320"/><path class="d-line" d="M762 160L762 240L460 240L460 320"/><g transform="translate(762 160) rotate(-90)"><circle class="d-head hollow" cx="-7" cy="0" r="7"/><path class="d-head" d="M-14 0H0M-7 -7V7"/></g></g><g class="d-path" data-path="pa_043"><path class="d-hit" d="M762 160L762 240L752 240L752 320"/><path class="d-line" d="M7